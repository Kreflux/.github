name: Organization Profile CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate-files:
    name: Validate Profile & Community Standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Required Community & Profile Files
        run: |
          echo "Verifying mandatory organization health files..."
          REQUIRED_FILES=(
            "profile/README.md"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
          )
          
          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Error: Required file '$file' is missing!"
              exit 1
            fi
            if [ ! -s "$file" ]; then
              echo "❌ Error: Required file '$file' is empty!"
              exit 1
            fi
            echo "✅ Verified $file"
          done
          echo "All mandatory files exist and are populated."

  markdown-lint:
    name: Markdown Lint & Link Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Markdown Linter
        run: |
          npx --yes markdownlint-cli "profile/README.md" "*.md" --disable MD013 MD033 MD041 MD024
